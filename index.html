<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Message for You</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #fce4ec; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Poppins', sans-serif; overflow: hidden; position: relative; }
        .container { text-align: center; padding: 20px; max-width: 400px; z-index: 10; background: rgba(255, 255, 255, 0.3); border-radius: 20px; backdrop-filter: blur(5px); }
        img { height: 200px; border-radius: 15px; margin-bottom: 20px; }
        h1 { color: #880e4f; font-size: 1.5rem; line-height: 1.4; }
        .buttons { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 30px; }
        .btn { border: none; padding: 12px 25px; border-radius: 50px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 16px; }
        .yes-btn { background-color: #ec407a; color: white; }
        .no-btn { background-color: #9e9e9e; color: white; }
        .next-btn { background-color: #ad1457; color: white; }
        .hidden { display: none; }

        /* Sparkle Animation for the Date */
        .sparkle {
            display: inline-block;
            color: #d81b60;
            font-weight: 600;
            animation: sparkle-effect 1.2s infinite;
        }

        @keyframes sparkle-effect {
            0%, 100% { transform: scale(1); text-shadow: 0 0 5px #fff, 0 0 10px #ffeb3b; }
            50% { transform: scale(1.1); text-shadow: 0 0 15px #fff, 0 0 25px #ff4081; }
        }

        /* Heart Rain Animation */
        .heart {
            position: absolute;
            top: -10%;
            color: #ff4081;
            font-size: 20px;
            user-select: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container" id="main-card">
        <div id="story-section">
            <img id="story-gif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueG56Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/K676T08HefYv6/giphy.gif">
            <h1 id="story-text">Remember our first date at Meat the Cheese? 🧀</h1>
            <div class="buttons">
                <button class="btn next-btn" onclick="nextStep()">Next... ❤️</button>
            </div>
        </div>

        <div id="question-section" class="hidden">
            <img id="question-gif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZ3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/L95W4wv8nNb9SaAXPQ/giphy.gif">
            <h1 id="question">Will you be my Valentine? ❤️</h1>
            <div class="buttons" id="action-buttons">
                <button class="btn yes-btn" id="yesBtn" onclick="celebrate()">Yes</button>
                <button class="btn no-btn" id="noBtn" onclick="growYes()">No</button>
            </div>
        </div>
    </div>

    <script>
        let currentStep = 0;
        const storyTexts = [
            "Ever since that day, I'm unable to stop thinking about you.",
            "I like you so, so much. ❤️",
            "So I have to ask..."
        ];
        
        // These are more reliable sticker URLs
        const storyGifs = [
            "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbTBqN2N6N2N6N2N6N2N6N2N6N2N6N2N6N2N6N2N6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/MDJ9IbxxvDUQM/giphy.gif",
            "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExY3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/14412/giphy.gif",
            "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHR6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/Y4THTR92hP9qE/giphy.gif"
        ];

        function nextStep() {
            if (currentStep < storyTexts.length) {
                document.getElementById("story-text").textContent = storyTexts[currentStep];
                document.getElementById("story-gif").src = storyGifs[currentStep];
                currentStep++;
            } else {
                document.getElementById("story-section").classList.add("hidden");
                document.getElementById("question-section").classList.remove("hidden");
            }
        }

        let noMessages = ["Are you sure?", "Really sure?", "Think about the cheese!", "Don't do this! 🥺"];
        let noIndex = 0;

        function growYes() {
            const yesBtn = document.getElementById("yesBtn");
            const noBtn = document.getElementById("noBtn");
            noBtn.textContent = noMessages[noIndex];
            noIndex = (noIndex + 1) % noMessages.length;
            const currentSize = parseFloat(window.getComputedStyle(yesBtn).fontSize);
            yesBtn.style.fontSize = (currentSize * 1.5) + "px";
        }

        function createHeart() {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.innerHTML = "❤️";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = Math.random() * 2 + 3 + "s";
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }

        function celebrate() {
            document.getElementById("question").innerHTML = "Yay! 😍<br><br>Let’s get married on <span class='sparkle'>26th March!</span> 💍";
            document.getElementById("question-gif").src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueG56Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/v4aGOHe3HihpXv8pE6/giphy.gif";
            document.getElementById("action-buttons").classList.add("hidden");
            document.body.style.backgroundColor = "#ffc1e3";
            setInterval(createHeart, 300); // Trigger Heart Rain
        }
    </script>
</body>
</html>
