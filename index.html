<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        body { background-color: #ffdeeb; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Arial', sans-serif; }
        .valentine-container { text-align: center; }
        #valentine-gif { height: 200px; margin-bottom: 20px; }
        h1 { color: #d63384; }
        .buttons { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 20px; }
        .yes-button { background-color: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .no-button { background-color: #dc3545; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <div class="valentine-container">
        <img id="valentine-gif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueG56Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/K676T08HefYv6/giphy.gif" alt="Cute Bear">
        <h1 id="question">Will you be my Valentine? ❤️</h1>
        <div class="buttons">
            <button class="yes-button" onclick="handleYesClick()">Yes</button>
            <button class="no-button" onclick="handleNoClick()">No</button>
        </div>
    </div>

    <script>
        const messages = ["Are you sure?", "Really sure??", "Think again!", "Last chance!", "Surely not?", "You might regret this!", "Give it another thought!", "Have a heart!"];
        let messageIndex = 0;
        function handleNoClick() {
            const noButton = document.querySelector(".no-button");
            const yesButton = document.querySelector(".yes-button");
            noButton.textContent = messages[messageIndex];
            messageIndex = (messageIndex + 1) % messages.length;
            const currentSize = parseFloat(window.getComputedStyle(yesButton).fontSize);
            yesButton.style.fontSize = `${currentSize * 1.5}px`;
        }
        function handleYesClick() {
            document.getElementById("question").textContent = "Yay! See you on the 14th! 😘";
            document.getElementById("valentine-gif").src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJueGZ3bmZ3bmZ3bmZ3/l41lTfH6S8A0WvSWA/giphy.gif";
            document.querySelector(".buttons").style.display = "none";
        }
    </script>
</body>
</html>
